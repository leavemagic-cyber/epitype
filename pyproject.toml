[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "epitype"
dynamic = ["version"]
description = "Epitype is a memory governance layer for CLI agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Repository = "https://github.com/leavemagic-cyber/epitype"

[project.scripts]
epitype = "epitype.cli:main"
epitype-graft = "install.graft:main"

[tool.setuptools]
packages = [
  "epitype",
  "adapters",
  "adapters.claude",
  "adapters.codex",
  "install",
  "exam",
]
include-package-data = false

[tool.setuptools.package-data]
"adapters.codex" = ["hooks_template.json"]
exam = ["sample_corpus.json"]

[tool.setuptools.dynamic]
version = {attr = "epitype.__version__"}
