name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install release frontends
        run: python -m pip install --upgrade build twine
      - name: Require a matching version and a green source tree
        run: |
          python -c "import epitype, json, os, sys; expected = os.environ['GITHUB_REF_NAME'].removeprefix('v'); npm = json.load(open('package.json', encoding='utf-8'))['version']; sys.exit(0 if epitype.__version__ == expected == npm else f'tag {expected} != package {epitype.__version__} / package.json {npm}')"
          python tests/run_all.py --jobs 4
      - name: Build sdist and wheel
        run: python -m build
      - name: Validate and exercise the exact wheel
        run: |
          python -m twine check dist/*
          python -m venv "$RUNNER_TEMP/epitype-smoke"
          "$RUNNER_TEMP/epitype-smoke/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/epitype-smoke/bin/python" -c "import epitype.decision_lint, epitype.ledger_gate, epitype.scar_census"
          "$RUNNER_TEMP/epitype-smoke/bin/python" -m epitype --version
          "$RUNNER_TEMP/epitype-smoke/bin/python" -m epitype search --help
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish distribution to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Attach distributions to the GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Create or update the release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
          fi
