name: CI

# Runs only where a red light is worth an email: the published branch, release
# tags, and incoming pull requests (owner ruling 2026-09-02).
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - '3.11'
          - '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run component selftests
        run: python tests/run_all.py
      - name: Run privacy lint
        run: python tests/privacy_lint.py
