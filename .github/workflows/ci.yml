name: FIXLOAD1 targeted validation

# Runs only where a red light is worth an email: the published branch, release
# tags, and incoming pull requests (owner ruling 2026-09-02).
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - '3.11'
          - '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Fixed-load accounting
        run: python tests/fixed_load_regression.py --selftest
      - name: Fixed-load hook integration
        run: python tests/fixed_load_hook_regression.py --selftest
      - name: Starter package compatibility
        run: python tests/starter_pack_regression.py --selftest

  package:
    name: Installed wheel smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Exercise the installed artifact outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/epitype-smoke"
          "$RUNNER_TEMP/epitype-smoke/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/epitype-smoke/bin/python" -c "import epitype.decision_lint, epitype.ledger_gate, epitype.scar_census"
          "$RUNNER_TEMP/epitype-smoke/bin/python" -m epitype --version
          "$RUNNER_TEMP/epitype-smoke/bin/python" -m epitype search --help
          "$RUNNER_TEMP/epitype-smoke/bin/python" -m epitype fixed-load --home "$RUNNER_TEMP/clean-home" --cwd "$RUNNER_TEMP" --json
          "$RUNNER_TEMP/epitype-smoke/bin/python" -c "from epitype.fixed_load import load_policy; assert sum(load_policy()['targets'].values()) == 49999; print('Installed fixed-load policy PASS')"
